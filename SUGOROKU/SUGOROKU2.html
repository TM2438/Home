<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>西宮すごろく - クイック版</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f9f9f9; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1, h2 { text-align: center; color: #333; }
        .section { margin-bottom: 20px; }
        .radio-group { display: flex; justify-content: center; gap: 15px; margin-bottom: 15px; }
        .input-group { text-align: center; margin-bottom: 20px; }
        input[type="text"] { font-size: 20px; padding: 5px; width: 60px; text-align: center; text-transform: uppercase; }
        button { font-size: 16px; padding: 8px 20px; cursor: pointer; }
        dialog { border: none; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); width: 90%; max-width: 500px; padding: 20px; max-height: 80vh; overflow-y: auto; }
        dialog::backdrop { background: rgba(0,0,0,0.5); }
        .dialog-content p { margin: 10px 0; line-height: 1.5; }
        .label { font-weight: bold; color: #0056b3; }
        .mp-result { font-weight: bold; color: #d9534f; font-size: 1.1em; background: #fdf0f0; padding: 10px; border-radius: 4px; text-align: center; }
    </style>
</head>
<body>

<div class="container" id="mainScreen">
    <h1>西宮すごろく (クイック版)</h1>
    
    <div class="section radio-group">
        <label><input type="radio" name="season" value="春" checked> 春</label>
        <label><input type="radio" name="season" value="夏"> 夏</label>
        <label><input type="radio" name="season" value="秋"> 秋</label>
        <label><input type="radio" name="season" value="冬"> 冬</label>
    </div>

    <div class="section input-group">
        <label>セル番号： <input type="text" id="cellInput" maxlength="2" autofocus></label>
    </div>

    <div style="text-align: center;">
        <button id="okBtn">OK</button>
    </div>
</div>

<!-- うんちくダイアログ -->
<dialog id="infoDialog">
    <h2>西宮うんちく</h2>
    <div class="dialog-content">
        <p><span class="label">【季節・セル】</span> <span id="dlgSeasonCell"></span></p>
        <p><span class="label">【名称】</span> <span id="dlgName"></span></p>
        <p><span class="label">【説明文】</span><br><span id="dlgDesc"></span></p>
        <p><span class="label">【うんちく】</span><br><span id="dlgUnchiku"></span></p>
        <p class="mp-result" id="dlgMp"></p>
    </div>
    <div style="text-align: center; margin-top: 20px;">
        <button id="dialogOkBtn">OK</button>
    </div>
</dialog>

<script>
    let placeData = [];

    const embeddedCSV = `﻿季節,セル位置,No,名称,分類,URL,説明文,うんちく1,うんちく2,うんちく3,,,,
1_春,A2,93,森具公園,公園,https://www.nishi.or.jp/,かつて森具村があった歴史を伝える名前で、地元住民の憩いの場として親しまれる公園。春には桜が咲き誇り、遊具や広場もあるため子供連れの家族でにぎわう身近な自然スポットです。,森具公園の「森具」は、夙村から守具村を経て生まれた地名で、夙川と深い歴史的つながりを持つ。,森具公園東側のお地蔵様は、阪神・淡路大震災からの復興の過程で再建された地蔵堂。公園とともに地域再生の歴史を静かに見守っている。,森具公園は震災復興の中で生まれた“備える公園”。地下貯水タンクや手押しポンプが、防災への工夫を今に伝えている。,,,,
1_春,A3,156,片鉾池,自然,https://nishimag.com/trip/spot/8967/,阪急夙川駅の南側、夙川公園内にある直径100m弱の美しい池。明治時代に開園した「香櫨園遊園地」の跡地であり、池のほとりには松下幸之助氏が寄贈した夙川公民館（松下記念ホール）が建つ。,池には関西初のウォーターシュートが設置され、当時最先端のレジャースポットとして賑わった。,片鉾池の近くにあった香櫨園遊園地では、1910年に日本初の日米野球とされる早大対シカゴ大戦が開催された。この熱狂は阪神電鉄に野球の可能性を認識させ、後の鳴尾運動場、そして甲子園球場誕生へとつながっていった。,水鳥（カモやアオサギなど）が多く生息し、写真撮影のスポットとして人気。,,,,
1_春,A4,92,新池,自然,https://nishinomiya-style.jp/glossary/shinike,西宮市立西宮高校の隣に位置する周囲約600mの農業用ため池。水鳥が集まるバードウォッチングの穴場であり、アニメ『涼宮ハルヒの憂鬱』に登場する「みくる池」のモデルとしてもファンに有名。,江戸時代から続くかんがい用ため池で現在も地域の水辺環境を守っている。,カモやサギなどの渡り鳥・水鳥が飛来するためバードウォッチングの隠れた名所。,アニメファンにとっては「みくる池」として知られ、聖地巡礼で訪れる人も多い。,,,,
1_春,A5,165,満池谷（ニテコ池周辺）,自然,https://www.nishi.or.jp/,ニテコ池は満池谷にある三つの池の総称。西宮神社の大練塀築造のために採土した跡地が池になったと伝わり、万葉ゆかりの名次山や『火垂るの墓』の舞台としても知られる。,小説『火垂るの墓』で清太と節子が横穴で暮らした「ニテコ池」の舞台そのもの。,ニテコ池は自然の池ではなく、西宮神社の重要文化財「大練塀」を造るために土を掘った跡地と伝わる。池の名も、人足たちの「ネッテコイ（練って来い）」という掛け声に由来するとされる。,満池谷墓地は単なる市営墓地ではない。六湛寺墓地、今津墓地、津門東墓地などを集約してできた“西宮の歴史人物が集まる墓地”であり、市役所の建つ六湛寺町はもともと墓地だった。,,,,
1_春,A6,88,上ヶ原文教地区,施設,https://www.nishi.or.jp/,関西学院大学を中心に、神戸女学院大学などが集まる学園都市エリア。「スパニッシュ・ミッション・スタイル」と呼ばれる統一された美しい建築群と緑が調和した景観が魅力です。,関西学院大学の時計台(旧図書館)は2009年6月19日に「登録有形文化財」に登録されています。,地区全体が「文教地区」として美しい街並み景観が厳格に保たれている。,春にはキャンパスや周辺道路の桜並木が非常に美しく学生街ならではの爽やかな活気がある。,,,,
1_春,A7,136,東川親水南公園,公園,https://www.nishi.or.jp/,市内を流れる東川沿いに整備された親水公園です。川と触れ合えるように階段や飛び石などが配置されており、都市部でありながら水遊びや散策など水と緑を感じられる憩いの空間です。,川のせせらぎをすぐ間近に感じながら安全にウォーキングや散策ができる水辺の公園。,春には川沿いに桜や季節の花が咲き近隣住民のお散歩コースとして定番。,水辺に降りられる親水スペースがあり野鳥や水生生物の観察ができる。,,,,
1_春,B1,54,甲山,自然,https://www.nishi.or.jp/,西宮市のシンボルとして親しまれる標高309メートルの釣鐘型の山。神功皇后が国家平安を祈願して兜を埋めた伝説が名前の由来とされ、ハイキングコースからは市内を一望できます。,火山ではなく約1200万年前の溶岩（安山岩）が侵食に耐えて残った「火山岩頸」という珍しい地形。,山頂の遺跡から縄文・弥生時代の祭事様の銅戈(鉾(ほこ))が出土している。,山頂からは西宮市街や大阪平野・大阪湾が一望できると思われているが、木々が生い茂り見ることができない。,,,,
1_春,B2,11,桜翁稲荷大明神,寺神社,https://nishimag.com/trip/spot/51472/,今津の住宅街にひっそりと佇む小さなお稲荷さん。狐が化けたお爺さんにまつわる西宮のふるさと民話「今津の桜翁」の舞台として知られ、『まんが日本昔ばなし』でも酒造りの町のお話として紹介された。,ここは『今津の桜翁』の伝説が残る稲荷社です。囲碁好きで酒好きだった上品なお爺さんの正体は実は狐。亡くなった後、その徳を慕う人々によって祀られたと伝わっています。,多くの稲荷神社は稲荷神を祀り、狐は使い（眷属）ですが、この神社は、狐が神様になった神社,今津駅から徒歩数分なのに知名度が低い,,,,
1_春,B3,23,雲井児童遊園(夙川舞桜),公園,https://www.nishi.or.jp/,阪急夙川駅の北西にある小さな公園。西宮市オリジナルの桜品種「夙川舞桜」の原木があり、咲き始めは淡いピンク色、満開時は白色に変化する珍しい桜を楽しむことができます。,西宮市で発見・命名されたオリジナル品種の桜「夙川舞桜（しゅくがわまいざくら）」が見られる希少な公園。,夙川舞桜は半八重～八重咲きで色は淡紅色から白色へ変化する独特の美しさを持つ。,夙川の桜並木から少し入った隠れた名所で静かに桜を鑑賞できる穴場。,,,,
1_春,B4,89,さくらやまなみバス,交通,https://www.nishi.or.jp/kotsu/kotsu/sakurayamanami/,西宮市の南部市街地と北部の山口・船坂地域を乗り換えなしで結ぶ路線バス。六甲山系の美しい自然の中を走り、市民の生活や観光の足として活躍しています。,西宮の南北を直結する唯一の公共交通機関で、車窓からの六甲山の景色が美しい。,さくらやまなみバスは阪急バスが運行していますが、西宮市の南北を結ぶ路線として専用デザインの車両が使用されています。,北部の有馬温泉周辺やハイキングコースへのアクセスにも非常に便利で観光客も利用する。,,,,
1_春,B5,32,回生病院,施設,https://www.kaisei-hp.jp/,香櫨園の海辺近くにある歴史ある病院。小説『火垂るの墓』に登場する病院のモデルとしても知られ、かつては洋館のサナトリウムとして患者が訪れました。,小説・アニメ映画『火垂るの墓』で主人公の母親が入院した病院として描かれている。,かつてはヴォーリズ建築の洋風病棟があり夙川のモダニズム文化を象徴する建物だった。,病院周辺の夙川沿いは昭和初期の阪神間モダニズムの雰囲気を今に伝える散策路。,,,,
1_春,B6,21,ららぽーと甲子園,商業施設,https://mitsui-shopping-park.com/lalaport/koshien/,阪神パークの跡地に2004年に開業した、三井不動産が運営する大型ショッピングモール。約150の専門店やイトーヨーカドーが入り、子どもが職業体験できる「キッザニア甲子園」も併設されている。,かつてここにあった関西の名物遊園地「阪神パーク」の跡地に建設された。,関西初の職業体験テーマパーク「キッザニア甲子園」が敷地内にある。,野球開催日にはユニフォーム姿の阪神タイガースファンで館内が黄色く染まる。,,,,
1_春,B7,28,塩瀬中央公園,公園,https://www.nishi.or.jp/,西宮市北部の名塩地区にある広大な総合公園。テニスコートなどのスポーツ施設のほか、ローラー滑り台などの大型遊具があり、自然豊かな環境の中で体を動かして楽しむことができます。,全長約80mにも及ぶロングローラーすべり台があり子どもたちに大人気。,山の斜面を活かした立体的な公園でテニスコートやグラウンド・体育館も完備。,展望台からは塩瀬地区の街並みや豊かな山々が一望できる絶景スポット。,,,,
1_春,C1,159,北山池,自然,https://www.nishi.or.jp/,北山緑化植物園の近くにある緑豊かなため池。周囲には遊歩道が整備されており、野鳥のさえずりを聞きながら四季折々の自然の移ろいを感じられるリフレッシュスポットです。,甲山と緑豊かな森林をバックに抱く絵画のように美しい池。,北山緑化植物園から散策路が続いており四季折々の花や紅葉と一緒に散策できる。,穏やかな水面にはカモなどの水鳥が優雅に泳ぎ心の癒やしスポットとなっている。,,,,
1_春,C2,7,大東公園(今津紅寒桜),公園,https://www.nishi.or.jp/,今津エリアにある公園で、早咲きの「今津紅寒桜」が見られることで有名です。2月下旬から3月上旬にかけて濃いピンク色の可憐な花を咲かせ、一足早い春の訪れを告げてくれます。,2月下旬～3月上旬という早い時期に濃いピンク色の花を咲かせる「今津紅寒桜」がある。,今津紅寒桜は西宮市内で「いち早く春の訪れを告げる桜」としてニュース等でも話題になる。,住宅街の静かな公園ながら早咲きの桜を求めて遠方から写真を撮りに来るファンも多い。,,,,
1_春,C3,56,甲山自然学習館,施設,https://kabutoyama-cbd.com/,甲山森林公園内にある自然学習施設。甲山周辺の動植物や昆虫、地質に関する展示があり、周辺の自然環境について楽しく学べる環境学習の場やハイキングの拠点として活用されています。,甲山周辺に生息する昆虫や野鳥・植物の標本・資料が豊富に揃う無料の学習施設。,季節ごとに自然観察会やクラフト工作ワークショップが開催されファミリーに大人気。,館内のスタッフから甲山や甲山湿原の最新の見どころ情報を教えてもらえる。,,,,
1_春,C4,66,甲子園歴史館,博物館,https://koshien-rekishikan.hanshin.co.jp/,阪神甲子園球場に併設された博物館。高校野球の感動の歴史や、阪神タイガースの栄光の軌跡、球場自体の成り立ちについて貴重な展示品で紹介する、野球ファン必見の聖地巡礼スポットです。,高校野球の優勝名シーンや名選手のバット・グラブ・タイガースの永久欠番展示などがずらり。,バックスクリーン裏の「バックスクリーンビュー」から球場内を一望できる激レア体験ができる。,ドラフト指名体験ができるAR写真コーナーや球場体験VRなど体感型コンテンツも充実。,,,,
1_春,C5,186,廣田神社,寺神社,https://www.hirotajinja.or.jp/,神功皇后の御代に創建されたと伝わる兵庫県第一の古社。天照大御神の荒御魂を祀り、阪神タイガースが必勝祈願に訪れることでも有名。春は境内のコバノミツバツツジが美しく咲き誇ります。,阪神タイガースが毎年チーム一丸となって「必勝祈願」に参拝する神社として全国的に有名。,中世、京の都から見て西方にある重要な神社であった廣田神社は『西宮』と呼ばれていた。,神功皇后の時代からの由緒を持つ兵庫県内屈指の古社で天照大御神の荒御魂を祀る。,,,,
1_春,C6,58,甲山森林公園,公園,https://www.hyogo-park.or.jp/kabutoyama/,甲山の大部分を占める広大な県立公園。豊かな自然林に囲まれ、展望台、芝生広場、彫刻作品が点在。ハイキングや野鳥観察など、年間を通じて自然と触れ合える県民の憩いの場です。,甲山森林公園は、西宮が舞台の人気アニメ『涼宮ハルヒの憂鬱』の聖地です。SOS団の映画撮影やセミ取りのシーンに登場し、今も多くの聖地巡礼ファンが訪れています。,彫刻の道から笠形噴水、愛の像と続く視線の先に甲山がある,展望台は阪神間が一望できる場所で、天気がいい日は伊丹空港や大阪湾、生駒山まで見える。新幹線や、飛行機の離発着を遠くから見ることもできるので、乗り物好きな方も楽しめます,,,,
1_春,C7,45,銀水橋,施設,https://www.nishi.or.jp/,阪急甲陽園駅の北側、夙川の上流部に架かる風情ある橋。ここから上流は滝や急峻な六甲山系へと続いており、甲山やゴロゴロ岳、北山緑化植物園へ向かうハイキングコースの出発点として親しまれる。,夙川の上流部に架かっており、ここから先は甲山や六甲山系の大自然が広がるハイキングの起点。,橋の近くには緑豊かな渓谷美が広がり、市街地から少し登るだけで別世界のような清流が楽しめる。,春から初夏にかけては新緑が美しく、散策や川遊びを楽しむ地元の子供たちでにぎわう。,,,,
1_春,D1,62,甲子園口SL公園,公園,https://hanshin-enkachi.com/parkguide/%E7%94%B2%E5%AD%90%E5%9C%92%E5%8F%A3sl%E5%85%AC%E5%9C%92/,JR甲子園口駅近くの線路沿いにある細長い公園。蒸気機関車そのものはないが、かつて武庫川線で使用されていた本物のSLの給水塔が保存・展示されており、桜と一緒に電車を眺められるスポット。,蒸気機関車本体はないが、かつて武庫川線を走ったSLに水を補給するための貴重な給水塔が残る。,JR神戸線の線路沿いにあるため、公園から行き交う電車を間近で眺めることができる。,春には桜が咲き、JR神戸線を走る電車と、武庫川線で使われていた蒸気機関車の給水塔を一緒に楽しめる、鉄道ファンにも人気のスポットです。,,,,
1_春,D2,100,生瀬宿場町跡,史跡,https://www.nishi.or.jp/,生瀬地区はかつて有馬温泉へ向かう「有馬街道」の重要な宿場町として栄えました。現在も当時の面影を残す古い町並みや道標、浄橋寺などが点在し、風情ある歴史散策を楽しむことができます。,豊臣秀吉も有馬温泉へ向かう際に立ち寄ったとされる歴史ある有馬街道の宿場町。,昔ながらの細い路地や古い木造建築・常夜燈などが今も静かに残っている。,武田尾・生瀬の武庫川渓谷（JR福知山線廃線跡）の散策ルートの始点としても有名。,,,,
1_春,D3,125,船坂の里山風景,自然,https://www.nishi.or.jp/,西宮市の最北部、六甲山の豊かな自然に抱かれた船坂地区に広がる里山風景。茅葺き屋根の古民家や段々畑が残り、秋にはアートイベントが開催されるなど農村の原風景を伝えています。,阪神間とは思えないほど美しい日本の原風景（棚田や里山）がそのまま残る地域。,地元農家によるそば栽培や「船坂ビエンナーレ」などの地域アート活動でも有名。,寒暖差が激しいため美味しいお米や野菜が育ち名物の「船坂そば」が味わえる。,,,,
1_春,D4,187,廣田神社参道,史跡,https://www.hirotajinja.or.jp/,廣田神社の南へ真っ直ぐ延びる美しい松並木の参道。かつては海まで続いていたとされ、現在も道の両側に立派なクロマツが立ち並び、神社へ向かう参拝者の心を落ち着かせてくれます。,参道沿いには立派な松並木が続き江戸時代からの旧参道の趣を今に伝えている。,大鳥居をくぐり神社へ向かう一本道は春には周辺の青葉や花々で彩られる。,参道の横の道路名は『広田参道筋』。廣田神社への歴史ある参詣道の名残で、2014年には参道も再整備され、昔の参拝の風景を現代に伝えています,,,,
1_春,D5,1,CLUB NISHINOMIYA,施設,https://clubnishinomiya-campfield.com/,西宮市山口町船坂にある、市街地から車でわずか15分のアウトドアレジャー施設。豊かな自然の中でバレルサウナやテントキャンプ、電動バギー体験ができ、家族や仲間と日帰りでも気軽に楽しめる。,設内の竹林に囲まれたバレルサウナは、オーナーが製作したもの。セルフロウリュも楽しめ、自然の中で“ととのう”体験ができます,一般的なキャンプ場では珍しく、電動バギーやトライクのレンタルが用意されています。子ども向け車両もあり、アウトドアとモビリティ体験を同時に楽しめます。,施設から有馬温泉までは車で約10分圏内。キャンプやBBQ、サウナを楽しんだ後に温泉へ立ち寄るという、六甲山北側ならではの過ごし方も人気です,,,,
1_春,D6,124,盤滝（ばんたき）トンネル,施設,https://www.nishi.or.jp/,西宮市の市街地と北部の山口町を六甲山系を貫いて結ぶ重要なトンネル。開通により南北の交通アクセスが劇的に向上し、市民の生活や物流を支える大動脈となっています。,盤滝トンネル開通前、西宮北部の山口地域から市街地へは船坂峠を越える必要があり、道路事情も良くありませんでした。地域にとって悲願の道路でした。,トンネル工事中に予想外の異常出水が発生したものの、工事を克服して1991年に開通しました。,盤滝トンネルは長らく有料道路だったけれど、実は当初予定より3年も早い2018年に無料化されたんですよ。,,,,
1_春,D7,106,西宮市大谷記念美術館,美術館,https://otani-art-museum.jp/,実業家・大谷竹次郎氏の寄贈により開館した美術館。近代日本の洋画・日本画、フランス近代絵画などを多数所蔵。水と緑が美しい日本庭園も併設され、芸術と自然を同時に堪能できます。,毎年夏に開催される「イタリア・ボローニャ国際絵本原画展」は全国からファンが集まる大人気展。,館内から眺められる回遊式日本庭園は絶景で滝の水音と四季の池の景色を鑑賞できる。,日本庭園には、岡本太郎作品《午後の日》が飾られている。太陽の塔の子供時代のような作品,,,,
1_春,E1,25,越水浄水場,施設,https://www.nishi.or.jp/,昭和初期に建設された西宮市の基幹浄水場で、六甲山の豊かな水を市民に供給しています。場内には桜が多数植えられており、春の「桜の通り抜け」期間中のみ一般公開される桜の名所です。,越水浄水場の津波桜は、東日本大震災の津波を乗り越えて花を咲かせた桜の子孫です。,敷地内には約400本の桜があり色鮮やかな「ヤエベニシダレ」などが咲き誇る。,「浄水場」と名前だが、現在は浄水処理は実施しておらず配水をしている。,,,,
1_春,E2,53,広田山公園,公園,https://www.nishi.or.jp/,廣田神社の周辺丘陵地に広がる公園。県指定天然記念物のコバノミツバツツジが群生しており、4月上旬から中旬にかけて山全体がピンク色に染まる壮大な景色は西宮の春の風物詩です。,春（4月上旬）には約2万株ものコバノミツバツツジが山全体を鮮やかな紫ピンク色に染め上げる。,ツツジ群落は兵庫県の天然記念物に指定されている大変貴重な植物群。,廣田神社の境内と一体となっており散策路には歴史を感じる松林や古木が残る。,,,,
1_春,E3,131,クリエートにしのみや,施設,https://nishinomiya-style.jp/create/,ららぽーと甲子園内にある、西宮市の魅力や情報を発信する市のギャラリー兼情報ステーション。歴史や文化の展示、市民向けワークショップなど多彩なイベントが開催されます。,ららぽーと甲子園の2階にあり、買い物の合間に西宮の歴史や文化に触れることができる。,アニメ「涼宮ハルヒの憂鬱」関連の展示や、地元情報誌のバックナンバーなどが揃うファン必見の場所。,西宮に関する歴史・文化・文学の本が揃っており、地元を深く知ることができる小さな図書館のような役割も担っています。,,,,
1_春,E4,6,エビスタ西宮,商業施設,https://www.ebista.com/,阪神西宮駅の高架下に展開するショッピングセンター。「えびす様」を祀る西宮神社のお膝元であることが名前の由来で、スーパーや多彩な専門店、フードコートが集まり非常に便利です。,阪神電車「えびす様」のお膝元にちなみえべっさんの「エビ」とステーションの「スタ」から命名。,フードスクエア「STREET KITCHEN」は地元市民の普段使いや呑み歩きスポットとして大人気。,阪神西宮駅直結のため雨に一切濡れずに買い物が楽しめる。,,,,
1_春,E5,160,北山貯水池,自然,https://www.nishi.or.jp/,甲山と六甲山系に囲まれた静かな貯水池。周囲は緑豊かなハイキングコースとなっており、水面に映る山々の景色が美しく、四季折々の自然を楽しみながら散策できる絶好のスポットです。,「甲山を映す湖面と枝垂れ桜」。実は北山貯水池は観光地というより、“地元の人がこっそり教えたい西宮の絶景スポット”です,貯水池の周囲約1.5kmには歩道が整えられており市民のジョギング・散歩の定番コース。,西宮市の大切な上水道の水源であり四季折々の六甲の山並みを映し出す。,,,,
1_春,E6,81,斜行エレベーター(名塩),施設,https://www.nishi.or.jp/,高低差の激しい名塩地区に設置された、全国的にも珍しい斜めに動くエレベーター。ガラス張りの車体からは名塩の美しい山並みや街の景色を一望できるユニークな公共の交通機関です。,住宅地とJR西宮名塩駅を直結するため斜度約30度の斜面を走る日本屈指の斜行エレベーター。,乗車料金は無料！まるでケーブルカーやアトラクションに乗っているような感覚を味わえる。,名塩ニュータウンの斜行エレベーターは、単なるエレベーターではなく、西宮市では『市道』として扱われています。,,,,
1_春,E7,16,フレンテ西宮,商業施設,https://www.frente-nishinomiya.com/,JR西宮駅南口に直結する複合商業施設。コープこうべを核にファッションや飲食の専門店が揃い、上層階にはフレンテホールなどの公共施設も入る市民の生活と文化の拠点です。,館内5階には約300席の「フレンテホール」があり演劇やコンサートの拠点となっている。,JR西宮駅前再開発の象徴として1994年に開業し駅南側のランドマークとなっている。,地下1階のスーパーから専門店までJR西宮利用者の生活を支える中心地。,,,,
1_春,F1,135,東山台桜通り,自然,https://www.nishi.or.jp/,西宮名塩ニュータウンの東山台地区を南北に貫くメインストリート。春になると道路の両側に植えられた見事な桜並木が一斉に開花し、見事な桜のトンネルを作り出す隠れたお花見スポットです。,ニュータウン開発時に計画的に植えられた桜が成長し春には圧巻の「桜のトンネル」が出現する。,坂道沿いに桜が並ぶため立体感のあるお花見ドライブ＆散策が楽しめる。,西宮北部の春の風物詩として地元の名塩住民に深く愛されている絶景ロード。,,,,
1_春,F2,87,松原神社,寺神社,https://www.nishi.or.jp/,松原町に鎮座する地域の守り神。閑静な住宅街の中にあり境内は緑豊かで静寂に包まれています。秋の例祭ではだんじり巡行が行われ、地域のお祭りとして大いに賑わいます。,地元松原町の鎮守様として秋の例大祭や正月には地域住民で賑わう。,境内は緑豊かで静けさがあり古くから地域の人々の心のよりどころとなっている。,松原天満宮の境内にある筆塚には、受験勉強を支えた鉛筆が数多く奉納されている。学問の神様・菅原道真公を祀る神社ならではの光景で、合格祈願や学業成就への願いが込められている。,,,,
1_春,F3,143,農協市場館彩菜やまぐち,施設,https://www.jahyogo.or.jp/,JA兵庫六甲が運営する農産物直売所。西宮市北部の山口町や船坂地区などで採れた新鮮な地場野菜や果物、お米などが豊富に並び、安心・安全な食材を求めて多くの人が訪れます。,地元農家が毎朝直接持ち込む新鮮な「朝採れ野菜」が大人気で午前中に売り切れることも。,寒暖差の大きい山口地区特有の甘みの強い野菜や米・加工品が手に入る。,西宮市街地から有馬温泉や三田方面へドライブする際の人気立ち寄りスポット。,,,,
1_春,F4,48,月見里公園,公園,https://hanshin-enkachi.com/parkguide/%E6%9C%88%E8%A6%8B%E9%87%8C%E5%85%AC%E5%9C%92/,甲子園球場の南側に位置する公園。以前この辺りが「月見の里」と呼ばれていたことが名前の由来とされる。本物の蒸気機関車（C11-311号機）が展示されており、桜やサルスベリの花の名所でもある。,難読熟語で「月見里」を「やまなし」と読む事が多いが、ここは、「つきみさと」。,園内には本物の蒸気機関車（C11-311号機）が静態保存されており、鉄道ファンの隠れた名所。,夏には色鮮やかなピンク色のサルスベリの花が咲き誇り、機関車の黒い車体とのコントラストが美しい。,,,,
1_春,F5,86,夙川河川敷緑地,公園,https://www.nishi.or.jp/,夙川の両岸約2.8kmにわたる緑豊かな河川敷公園。「日本さくら名所100選」に選ばれており、春には約1660本の桜が川を覆うように咲き誇る、西宮を代表するお花見のオアシスです。,昭和24年に当時の辰馬吉左衛門市長の提唱で桜の植樹が始まり約1000本の桜並木となった。,「日本のさくら名所100選」に選ばれており臨港線から苦楽園口まで桜のトンネルが続く。,河川敷全体が都市公園として指定されており散策や市民のジョギングコースとなっている。,,,,
1_春,F6,77,阪神甲子園球場(選抜高等学校野球大会),施設,https://www.hanshin.co.jp/koshien/,春には「センバツ」の愛称で親しまれる選抜高等学校野球大会が開催され、全国から集まった高校球児たちの熱戦が繰り広げられる、高校野球の聖地です。,大正13（1924）年の「甲子（きのえね）年」に完成したことから「甲子園」と命名された。,甲子園の土は黒土（鹿児島や岡山など）と白土（中国など）を季節でブレンドしている。,アルプススタンドの名称は白いシャツの観客群がアルプス山脈の雪のように見えたことから。芸術家・岡本太郎の父で漫画家の岡本一平が新聞に書いたことから。,,,,
1_春,F7,188,葭原橋（あしはらはし）,施設,https://www.nishi.or.jp/,夙川に架かる橋の中でも 河口から2番目に位置する小さな人道橋 です。,作家 村上春樹さんの短編エッセイ『ランゲルハンス島の午後』のモデルになった橋 として有名です。作品には「趣のある古い石の橋」として描かれています,橋の名前は「あしはらはし」ですが、周辺の地名である 上葭原・中葭原・下葭原は『よしはら』と読む ため、地元でも読み方の違いが話題になることがあります,5月頃は夙川を泳ぐ鯉のぼりが楽しめ、四季を通じて写真愛好家が訪れる人気スポット になっています,,,,
1_春,G1,80,山口中央公園,公園,https://www.nishi.or.jp/,山口町にある有馬川沿いに広がる公園。芝生広場やグラウンド、遊具が整備されており、春には川沿いの桜が満開になり秋には紅葉が美しい、自然豊かな環境でゆったりと過ごせる場所です。,北部山口地区のイベントやスポーツ大会の拠点となっている地域中心の総合公園。,春には公園周辺に桜が咲き誇り北部市民の花見スポットとして賑わう。,周辺の豊かな山々に囲まれた開放感たっぷりのロケーションで運動ができる。,,,,
1_春,G2,29,奥池,自然,https://www.nishi.or.jp/,六甲山の中腹、芦有ドライブウェイの途中にある風光明媚なため池。周囲は緑深い別荘地となっており、静寂な湖面と山の木々が織りなす景色はまるでヨーロッパの湖畔のような美しさです。,西宮市と芦屋市の境界近くに位置し江戸時代に新田開発の水源として造られたため池。,夏でも市街地より気温が数度低く静かな避暑地・別荘地として知られている。,秋には池の水面に映る紅葉が幻想的でハイキングコースの立ち寄り地点として人気。,,,,
1_春,G3,164,万葉植物苑,施設,https://www.nishi.or.jp/access/koen/nishida.html,西田公園内にあり、日本最古の和歌集「万葉集」にゆかりのある72種類の植物が植えられた趣ある植物苑。それぞれの植物には万葉歌の石碑や説明板が添えられ、四季折々の自然と万葉の世界を楽しめる。,万葉集の和歌に登場する植物が多数植えられており歌の解説板と一緒に楽しめる。,新元号「令和」の由来となった『万葉集』梅花の歌 にちなみ、園内には梅の木も多く植えられています。早春には万葉の世界を感じながら梅の花を楽しめます。,犬養孝博士は晩年を西宮で過ごしており、苑内には 犬養博士が選んだ万葉歌や歌碑 が設置されています。西宮と万葉文化を結ぶ貴重な場所です。,,,,
1_春,G4,57,甲山湿原,自然,https://www.nishi.or.jp/,甲山の麓に広がる県下でも珍しい湿原。サギソウやモウセンゴケなどの貴重な植物が自生し兵庫県の天然記念物に指定されています。整備された木道を歩きながら特異な生態系を観察できます。,日本最小のトンボ「ハッチョウトンボ（体長約2cm）」が生息する貴重な自然保護区。,夏には白いサギが飛んでいるような美しい姿の希少植物「サギソウ」が花を咲かせる。,都市近郊に残る大変珍しい低標高湿原として環境省の重要湿地にも選定。,,,,
1_春,G5,94,西宮七園,地域,https://www.nishi.or.jp/,甲子園、昭和園、甲風園、甲東園、甲陽園、苦楽園、香櫨園の「園」がつく7つの高級住宅街の総称。大正から昭和初期に鉄道網の発展とともに開発され、現在も阪神間モダニズムの優雅な景観を残します。,大正から昭和初期にかけて、私鉄各社が沿線開発として作り上げた阪神間屈指の邸宅街ネットワーク。,七園のうちの甲風園、甲東園、甲陽園の「甲」は、甲山から取っているが、甲子園の「甲」は甲山とは関係ない。,「園」がつく地名は、当時流行した遊園地やリゾート地の開発が起源となっている場所も多い。,,,,
1_春,G6,152,武庫川河川敷緑地,公園,https://www.nishi.or.jp/,武庫川の広大な河川敷を利用した公園。全長約7kmにわたってサイクリングロードやグラウンドが整備され、春には桜、秋にはコスモスが咲き誇る市民のスポーツと憩いの場です。,"ここは、兵庫県の「ふるさと桜づつみ回廊」の瀬戸内海側の起点に位置しています。春には約1,040本の桜が咲き誇り、武庫川を代表する花見スポットになります。",阪神武庫川駅は全国的にも珍しい「武庫川の川の上にホームがある駅」。,敷地が広大で春の花々やピクニック・スポーツなど市民のマルチなアウトドア空間。,,,,
2_夏,A2,113,西宮神社(ヱビスビールフェスタ),寺神社,https://nishinomiya-ebisu.jp/,毎年夏に全国のえびす神社の総本社である西宮神社の境内で開催されるビールフェスタ。ヱビスビールや地元グルメを味わいながら涼を楽しめる夏の風物詩です。,エビスビールの名前の由来となった「えびす様」の総本社で開催される、ビール好きにはたまらない夏イベント。,赤門から入る境内の屋台や特設会場で、キンキンに冷えた生ビールとご当地グルメを楽しめる。,西宮神社では、福男で有名な1月の十日えびすだけでなく、半年後の7月10日に『夏えびす』が行われます。『半年参り』ともいえる行事で、正月とは違った涼やかな雰囲気を楽しめます。,,,,
2_夏,A3,154,武庫川上流渓谷,自然,https://nishinomiya-kanko.jp/,西宮市北部を流れる武庫川上流に広がる自然豊かな渓谷。奇岩や巨岩が連なるダイナミックな景観と清流が美しく、夏は涼を求めるハイカーや川遊びの家族連れで賑わいます。,長い年月をかけて川が岩を削ってできた険しいV字谷で圧巻の自然造形美が広がる。,新緑の初夏や紅葉の秋には鮮やかなグラデーションが渓谷を彩り絶好の撮影スポット。,都市近郊にありながら手つかずの豊かな自然が残っておりハイキングファンに愛される。,,,,
2_夏,A4,103,西宮甲山乗馬クラブ,施設,https://nishinomiya-kanko.jp/,緑豊かな甲山のふもとに位置し、初心者から経験者まで気軽に馬と触れ合える乗馬クラブ。大自然に囲まれた馬場で、馬の温もりに癒されながらリフレッシュできる施設です。,市街地から近い甲山の豊かな森の中で馬とふれあい乗馬を楽しめる貴重な施設。,初心者向けの体験乗馬コースから本格的なレッスンまで子どもから大人まで楽しめる。,馬の背中に揺られながら自然を感じることで心身ともにリフレッシュできる癒しの体験。,,,,
2_夏,A5,177,鳴尾浜温泉熊野の郷,施設,https://www.kumano-no-sato.com/,鳴尾浜エリアにある、地下深くから湧き出る天然温泉が自慢の癒しの日帰り温浴施設。和風とバリ風の趣の異なる露天風呂を備え、都会の喧騒を離れてリゾート気分でくつろげます。,地下1000mから湧き出る源泉の天然温泉を楽しめる西宮市内の日帰り温泉！,和風とアジアンリゾート（バリ風）の2つの雰囲気が異なる浴室が男湯・女湯で日替わり交代。,露天風呂やサウナ・岩盤浴も完備され海辺のレジャー帰りに疲れを癒やすのに最高。,,,,
2_夏,A6,101,西宮交通公園（久保公園）,公園,https://www.nishi.or.jp/,遊びながら交通ルールを学べるよう、園内に横断歩道や信号機、標識が設置されている公園。遊具も充実しており、小さな子供連れの家族が安全に楽しく過ごせる憩いの場です。,本物そっくりの信号機や道路標識・横断歩道があり自転車で走れる！,遊びながら楽しく正しい交通ルールやマナーを身につけられるため幼児や小学生に大人気。,園内には緑も多く保護者が安心して子どもを遊ばせることができる地域に愛される公園。,,,,
2_夏,A7,150,武庫川サイクリングロード,施設,https://www.nishi.or.jp/,武庫川の河川敷に沿って整備された、見晴らしの良いサイクリング・歩行者専用道路。川のせせらぎや自然を感じながら、ウォーキングやランニング、自転車での散策を楽しめます。,車が入ってこない歩行者・自転車専用の道路なので安全にサイクリングやランニングを楽しめる。,武庫川の流れや四季折々の草花（春のからし菜、秋のコスモスなど）を眺めながら走る爽快コース！,北は宝塚方面から南は武庫川河口（大阪湾）まで一気に駆け抜けることができる市民のスポーツロード。,,,,
2_夏,B1,55,甲山キャンプ場,公園,https://www.nishi.or.jp/,標高309mの甲山山麓に広がる、豊かな緑と清々しい空気に包まれた市営キャンプ場。炊事場などが整備され、市街地から近くアクセス良好ながら本格的なアウトドア体験が可能です。,甲山の雄大な自然に囲まれながら野外炊事やバーベキュー・キャンプ体験ができる。,市内の小中学生が野外活動や野外学習で利用することも多く西宮市民には馴染み深い場所。,周辺には甲山森林公園や神呪寺・甲山湿原がありハイキングの拠点としても最適。,,,,
2_夏,B2,82,社家郷山キャンプ場,公園,https://www.nishi.or.jp/,西宮市北部の盤滝近くにある、豊かな森と美しい渓流に囲まれた自然あふれるキャンプ場。都会の喧騒を離れ、川遊びやバーベキューなど大自然を満喫できるアウトドア施設です。,豊かな森と小川に囲まれた静かなキャンプ場で本格的なアウトドア体験ができる。,社家郷山（しゃけごうやま）周辺は甲山や盤滝へと続くハイキングコースの起点にもなっている。,夏には沢遊びや昆虫採集が楽しめ市街地から少し離れた自然の宝庫。,,,,
2_夏,B3,22,一本松,史跡,https://nishinomiya-style.jp/glossary/iponmatsu,古くから和歌にも詠まれた「鳴尾の一本松」の跡地。かつては沖を航行する船の目印として親しまれ、現在は里中町の住宅街に松が植えられている。松はすでに5代目。,かつて鳴尾の海岸線にあった巨大な松で、沖合を航行する船が位置を知るための重要な目印だった。,室町時代などの古い和歌にも「鳴尾の一本松」として詠まれるほど、古くから全国的に有名な名所だった。,鳴尾の一本松はあまりに大きく、朝の影は須磨の一ノ谷まで、夕方の影は天王山や奈良の暗峠まで届いたと伝えられています。,,,,
2_夏,B4,102,西宮港跡,史跡,https://www.nishi.or.jp/,江戸時代に灘五郷の一つとして酒造業で栄え、江戸へと新酒を運ぶ樽廻船の拠点となった港の跡地。現在は埋め立てが進み当時の姿は残っていないが、西宮の発展を支えた歴史を今に伝える。,江戸時代、西宮で造られた美味しいお酒（新酒）を江戸へと運ぶ「樽廻船」がひしめき合っていた港の跡。,港の周辺には酒蔵や問屋が立ち並び、西宮が「灘五郷」の一つとして大繁栄する基盤となった場所。,現在は海岸線の埋め立てが進み当時の面影はないが、近くの「今津灯台」などがかつての港の活気を今に伝える。,,,,
2_夏,B5,35,海辺の道公園,公園,https://www.nishi.or.jp/,西宮浜の海岸線に沿って整備された、潮風が心地よい細長い海浜公園。ヤシの木が並ぶ南国風の遊歩道が続き、穏やかな海や夕日を眺めながらの散策やジョギングに最適なスポットです。,大阪湾を一望できる開放的なロケーションで夕暮れ時には美しい夕日が見られる。,遊歩道が平坦で広々としており愛犬の散歩やランニングコースとして地元市民に愛されている。,近くに西宮砲台やヨットハーバーがありウォーターフロント散策にぴったりの公園。,,,,
2_夏,B6,17,マンボウトンネル,史跡,https://nishinomiya-kanko.jp/,JR神戸線の線路下をくぐるために作られた、大人がかがんでやっと通れるほどの小さな歩行者用トンネル。かつての水路を利用したと言われ、レトロで不思議な生活道として有名です。,名前の「マンボウ」は魚ではなく、鉱山の坑道を意味する「間歩（まぶ）」が訛ったものと言われている。,元々は農業用の水路として作られたトンネルに板を渡して、人が通れるようにしたレトロな生活道。,大人は腰をかがめないと通れないほど天井が低く、レンガ造りの壁面がタイムスリップしたような雰囲気を醸し出す。,,,,
2_夏,B7,33,海清寺,寺神社,https://nishinomiya-kanko.jp/,室町時代に創建された臨済宗の古刹で、境内にそびえる樹齢約600年と伝わる見事な「大クス」で知られるお寺。県の天然記念物にも指定された巨木は圧巻の生命力を感じさせます。,応永元（1394）年創建とされる歴史ある禅寺で境内は非常に静かで凛とした空気が漂う。,境内にある大きなクスノキ（クスノキ群）は庫県指定の天然記念物に指定されている。,かつて西宮神社（えびす様）と深い関わりがあり西宮の歴史を語る上で欠かせない古刹の一つ。,,,,
2_夏,C1,157,蓬莱峡,自然,https://nishinomiya-kanko.jp/,西宮市北部に位置する、花崗岩が風化してできた無数の奇岩や剣山がそそり立つ荒涼とした渓谷。まるで異世界のようなダイナミックな景観が広がり、映画のロケ地にもなった景勝地です。,白い花崗岩が風化して削り出された無数の岩柱が立ち並び異世界のような壮大な景観！,黒澤明監督の映画『隠し砦の三悪人』の撮影ロケーションとしても使われた歴史がある。,風化しやすい花崗岩の地質であるため、雨風によって現在も少しずつその形を変え続けている。,,,,
2_夏,C2,123,西宮砲台,史跡,https://www.nishi.or.jp/,幕末に江戸幕府が黒船襲来に備えて大阪湾防衛のために建設した石造りの円堡（大砲の砲台）跡。国の史跡に指定されており、当時の海防の歴史を伝える貴重な近代化遺産です。,勝海舟の建言により幕末に作られた石造りの砲台で国の史跡に指定されている。,実際に大砲を試射した際煙が内部に充満したため一回使われただけで実戦には使われなかったという伝説がある。,明治時代に民間に払い下げられると、巨大な珍しい建築物として人気を集め、料亭やビアガーデンとして賑わいました 。,,,,
2_夏,C3,60,甲子園プラス,商業施設,https://koshien-plus.hanshin.co.jp/,阪神甲子園球場に隣接する、野球文化の発信や飲食、体験型施設が集まる複合商業施設。シミュレーション野球や甲子園歴史館の一部が入り、試合観戦の前後や休日のお出かけに最適です。,甲子園球場のすぐ南側にオープンし、球場の歴史や野球文化をより深く楽しめる新しい拠点。,施設内にはバッティングセンターやシミュレーション野球があり、子どもから大人まで本格的に遊べる。,飲食店にはテラス席もあり、試合開催日には球場の熱気や歓声を感じながら食事ができる。,,,,
2_夏,C4,74,阪急西宮ガーデンズ,商業施設,https://nishinomiya-gardens.com/,阪急西宮スタジアムの跡地に開業した、西日本最大級の広さを誇る大型ショッピングモール。多彩な店舗や映画館、屋上庭園を備え、ショッピングやグルメを一日中満喫できます。,かつて阪急ブレーブスの本拠地だった「阪急西宮球場」の跡地に建てられた。,4階のスカイガーデン（屋上庭園）の中央には西宮球場のホームプレートの位置を示すメモリアルがある！,4階スカイガーデンには、旧西宮球場のホームベース位置を示すモニュメントがあります。,,,,
2_夏,C5,178,鳴尾浜公園,公園,https://www.naruohama-park.jp/,鳴尾浜の海に面した、釣りや潮風を感じながらの散策が楽しめる広大な海浜公園。海釣り広場や芝生広場が整備され、海を行き交う船を眺めながらのんびりとリフレッシュできます。,海沿いに広がる緑豊かで広大な公園で四季折々の花壇（フラワーガーデン）が美しい。,園内には芝生広場があり家族でお弁当を広げてピクニックをするのに絶好のロケーション。,海釣り広場が併設されており釣りも公園遊びも両方一度に楽しめる。,,,,
2_夏,C6,67,香櫨園浜,自然,https://nishinomiya-kanko.jp/,御前浜に隣接する、阪神間では希少となった自然の砂浜や干潟が残る貴重な海浜エリア。野鳥の飛来地としても知られ、海辺の生き物観察や波打ち際の散歩など豊かな自然と触れ合えます。,阪神間では珍しくなった自然の砂浜が広がり、国指定の鳥獣保護区に指定されている野鳥の楽園。,干潮時には広大な干潟が現れ、カニやヤドカリなどの海の生き物を観察できる自然学習に最適なスポット。,幕末に勝海舟の勧めで作られた西宮砲台（国の史跡）が砂浜にそびえ立ち、歴史と自然が融合した景観が魅力。,,,,
2_夏,C7,36,関西学院大学キャンパス,施設,https://www.kwansei.ac.jp/,「日本一美しいキャンパス」とも称される、スパニッシュ・ミッション・スタイルで統一された学び舎。シンボルの時計台と中央芝生が織りなす異国情緒あふれる美しい景観が魅力です。,時計台越しに甲山が見える「中央芝生」の景観はヴォーリズ建築と自然が調和した絶景スポット！,スパニッシュ・ミッション・スタイルの赤い瓦屋根とクリーム色の壁で統一された美しい校舎群。,時計台（旧図書館）は国の登録有形文化財に指定されており西宮の文教都市としての象徴。,,,,
2_夏,D1,72,今津砲台跡,史跡,https://www.nishi.or.jp/,幕末の黒船来航に危機感を抱いた江戸幕府が、大阪湾岸防衛のために築造を命じた砲台の跡。西宮砲台と対をなす形で建設が進められましたが未完成に終わり、現在は記念碑が建っています。,黒船来航に備えて勝海舟の建白により大坂湾防衛のために計画された砲台の一つ。,明治42年(1910年)に民間に払い下げられ、大正4年(1915年)に解体された。,現在は公園の一角に記念碑がひっそりと建っており、幕末の激動の歴史を今に伝えている。,,,,
2_夏,D2,118,西宮中央商店街,商業施設,https://www.nishi.or.jp/,阪神西宮駅の南側に広がり、かつて西宮神社の門前町として栄えた歴史ある商店街。昔ながらの老舗店や地元の人々に愛される飲食店が軒を連ね、人情味あふれるローカルな活気が魅力です。,西宮神社の門前町として発展し昔ながらの老舗から個性的な新しいお店までが並ぶ。,阪神西宮駅から西宮神社へ向かう参道ルートに位置し食べ歩きや買い物が楽しめる。,毎年1月の「十日戎」の時期には、神社へ向かう参拝客で通りが埋め尽くされるほどの大賑わいを見せる。,,,,
2_夏,D3,121,西宮浜総合公園 多目的グラウンド,公園,https://www.nishi.or.jp/,西宮浜の人工島にある、サッカーなど多様なスポーツが楽しめる広々とした公園。海に近く開放的な環境の中、休日には多くのスポーツ愛好家で賑わう地域スポーツの拠点です。,最新のきれいな人工芝が敷き詰められた多目的グラウンドでナイター設備も完備。,公園内にはスケートボード場（スケボーパーク）やBMXエリアなどアーバンスポーツ施設も充実！,海に隣接した開放的なロケーションで思い切り汗を流すことができるスポーツの拠点。,,,,
2_夏,D4,179,網引公園,公園,https://anian-club.jp/spot/532/,甲子園球場から徒歩圏内の臨港線沿いにある市民の憩いの場。別名「アジサイ公園」と呼ばれ、梅雨の時期には色鮮やかな紫陽花が咲き誇る。遊具や噴水も充実しており、子ども連れの家族で賑わう。,かつてこの地域が漁業で「網を引いていた」ことにちなむ網引（あびき）の名を冠した公園。,園内にはたくさんの紫陽花が植えられており、梅雨の季節には「アジサイ公園」として美しく色づく。,甲子園球場から南へ少し歩いた場所にあり、噴水や大型遊具があるため近隣ファミリーの定番の遊び場。,,,,
2_夏,D5,3,JR福知山線廃線敷,史跡,https://nishinomiya-kanko.jp/,武田尾駅から生瀬駅にかけての武庫川渓谷沿いに残る、かつての鉄道の廃線跡を歩けるハイキングコース。真っ暗なトンネルや鉄橋、渓谷美を楽しみながら自然と鉄道遺産を満喫できます。,かつて蒸気機関車やディーゼル列車が走っていた線路跡で今も枕木が足元に残されている。,途中に暗闇のトンネルが6つあり通行には懐中電灯（ライト）が必須の冒険コース！,春の桜や秋の紅葉の名所として知られ渓谷美を眺めながらのハイキングは最高。,,,,
2_夏,D6,120,西宮浜ベイエリア,自然,https://nishinomiya-kanko.jp/,ヨットハーバーや海浜公園、おしゃれなカフェなどが点在する、リゾート感あふれる西宮浜の海岸エリア。潮風を感じながらの散歩やサイクリング、美しい夕焼けを楽しめる人気スポットです。,海に囲まれた人工島でマリンスポーツやジョギング・散歩を楽しめる市民の憩いのエリア。,週末にはヨットレースやアウトドアイベントが開催され爽やかな海の空気を感じられる。,大阪湾に沈む夕日の絶景スポットとして知られカップルのデートコースとしても人気。,,,,
2_夏,D7,119,西宮浜 BBQ PARK powered by LOGOS,施設,https://www.nishi.or.jp/,人気アウトドアブランド「LOGOS」がプロデュースする手ぶらで楽しめるBBQ施設。海と空が広がる開放的なロケーションで、面倒な準備不要で家族や友人と快適にバーベキューを満喫できます。,アウトドアブランドLOGOSのギアやテントが使われておりおしゃれにキャンプ気分が味わえる！,食材や道具がすべて用意されているため完全「手ぶら」でBBQが楽しめる手軽さが人気。,西宮浜の海風と広大な芝生を感じながらファミリーや友達同士で一日中過ごせる。,,,,
2_夏,E1,31,火垂るの墓記念碑,史跡,https://www.nishi.or.jp/,『火垂るの墓』の舞台である西宮市のニテコ池周辺（満池谷）に建てられた記念碑。平和への願いを込めて建立され、戦争の悲惨さと平和の尊さを後世に静かに伝え続けています。,小説の舞台であるニテコ池の近く（西宮市震災記念碑公園内）に設置され平和の尊さを今に伝える。,毎年終戦の日前後には物語に思いを馳せるファンや平和を願う人々が参拝に訪れる。,記念碑には清太と節子が蛍とたわむれる陶板の挿絵が描かれている。,,,,
2_夏,E2,51,御前浜橋（跳ね橋）,施設,https://www.nishi.or.jp/,西宮浜と御前浜を結ぶ、歩行者と自転車専用の珍しい可動橋（跳ね橋）。週末や祝日には、下を通過する船のために橋桁がダイナミックに跳ね上がる様子を見ることができ親しまれています。,航行するヨットや船のために橋の中央部がハの字型に跳ね上がる日本でも珍しい可動橋。,跳ね上がっている間は通行できないがダイナミックに開閉する様子が見られるシャッターチャンス！,橋の上からは御前浜の砂浜や甲山・遠くの六甲山系まで見渡せる絶絶のビュースポット。,,,,
2_夏,E3,134,津門中央公園,公園,https://parkful.net/2016/09/tsutochuo-park/,川崎製鉄から寄贈された敷地に広がる、川に挟まれた三角州状の大型公園。本格的な野球場や遊具を備えるほか、災害時の防災拠点としても機能する。春には川沿いが隠れた桜の名所となる。,本格的な夜間照明を備えた野球場（津門野球場）がありアマチュア野球の熱戦が繰り広げられる。,春には公園周辺に桜が咲き誇り近隣住民のお花見スポットや子どもの遊び場として大人気。,津門川と東川に挟まれた三角州に位置しており、広々としたグラウンドは地域の防災拠点としても重要。,,,,
2_夏,E4,10,キッザニア甲子園,施設,https://www.kidzania.jp/koshien/,ららぽーと甲子園内にある、子供たちが様々な職業に挑戦できる大人気の職業体験型テーマパーク。消防士やパン職人など約100種類の仕事を本格的な設備で体験し、社会の仕組みを学べます。,約2/3のスケールで作られたリアルな街並みで子どもたちが大人になりきってお仕事体験ができる。,働いた給料として専用通貨「キッゾ」がもらえ買い物や銀行に預金まですることができる。,関西唯一のキッザニアで地元の阪神電車や食品メーカーなどの本格的なパビリオンが立ち並ぶ。,,,,
2_夏,E5,170,名塩蘭学塾跡,史跡,https://www.nishi.or.jp/,江戸時代後期に、緒方洪庵から蘭学を学んだ伊藤慎蔵が名塩地区に開いた私塾の跡。西洋の近代的な学問や医療が教えられ、地域の教育や文化の発展に貢献した歴史を伝える史跡です。,幕末の蘭学者・緒方洪庵の妻八重の生家（億川家）があった場所で名塩の歴史的深さを物語る。,名塩紙（和紙）の産地としても有名な名塩地区は江戸時代から文化や学問の交流があった。,緒方洪庵や適塾に関わる名塩の隠れた歴史スポット。,,,,
2_夏,E6,91,新西宮ヨットハーバー,施設,https://www.sinnishinomiya-yh.co.jp/,西宮浜の南端にある、西日本最大級の規模を誇るマリーナ施設。数多くのヨットやクルーザーが停泊する様子は海外リゾートのようで、海を眺めながら食事ができるレストランもあります。,1989年、サンフランシスコから西宮まで約137日をかけて帰港し、「世界最小ヨットによる太平洋単独横断」として話題になった。そのミニマーメイド号が飾られている,多数のヨットやクルーザーが係留されまるで海外のリゾート地にいるようなロマンチックな雰囲気。,センターハウス内にはレストランやショップがあり海を眺めながら食事を楽しむことができる。,,,,
2_夏,E7,12,百間樋,史跡,https://nishinomiya-style.jp/glossary/hyakkenbi,1560年（永禄年間）に作られた水路。当時武庫川の対岸の村との水争いがあり、そのころに天井川の仁川の下をくぐって水路（樋）が作られ、その樋（水路）の長さから『百間樋』という名前になった。,戦国時代に農業用水を確保するため、川の下をくぐるという当時としては高度な技術で作られた地下水路。,長さが百間（約180m）あったことからその名がつき、現在も一部が地域の水路として利用されている。,武庫川の水争いを解決するための知恵の結晶であり、西宮の農業発展を支えた重要な歴史遺産。,,,,
2_夏,F1,149,浜甲子園運動公園,公園,https://www.nishi.or.jp/,甲子園浜に隣接し、体育館や野球場などの本格的なスポーツ施設を備えた総合公園。広大な敷地には遊具広場や散策路もあり、スポーツを楽しむ人や家族連れの憩いの場となっています。,多数のテニスコートや野球場を備えており西宮市のスポーツ大会の主要会場となっている。,甲子園浜に近接しておりスポーツを楽しんだあとに海辺を散歩するのに最高の立地。,園内にはかつて阪神電車で活躍した路面電車（甲子園線）の車両が保存されており、地域の歴史を伝えている。,,,,
2_夏,F2,99,生瀬渓谷,自然,https://nishinomiya-kanko.jp/,西宮市北部の生瀬地区から武田尾にかけて、武庫川の上流に広がる自然豊かな渓谷。巨岩や奇岩が織りなす荒々しくも美しい景色が広がり、四季折々の自然美を満喫できる景勝地です。,武庫川の侵食によって作られた削り立った岩壁と清流が見事でダイナミックな自然美を楽しめる。,JR福知山線廃線敷ハイキングコースのすぐ横に位置し四季折々の渓谷美を堪能できる。,かつては難所として知られ有馬街道の交通の要衝でもあった歴史と自然が交差する場所。,,,,
2_夏,F3,151,武庫川河口部散策路,自然,https://www.nishi.or.jp/,武庫川が大阪湾に注ぐ河口付近に整備された、見晴らしの良い遊歩道。潮風を感じながら、野鳥の観察や夕暮れ時の美しい水辺の風景を楽しみながらのんびりとウォーキングができます。,川と海が交わる雄大な河口景観が広がり夕刻には水平線に沈む夕日が美しい。,カモやサギ・シギなどの水鳥が多く飛来し野鳥観察（バードウォッチング）の隠れた名所。,潮風を感じながら静かに散策や釣りができ都市の喧騒を忘れられる癒しの空間。,,,,
2_夏,F4,50,御前浜,自然,https://nishinomiya-kanko.jp/,西宮砲台のすぐそばに広がる、松林と砂浜が美しい海浜公園。かつては白砂青松の美しい海岸として知られ、現在はウィンドサーフィンや水遊びを楽しむ人で賑わう開放的な海辺です。,阪神間では数少ない天然の砂浜や干潟が残っており様々な野鳥や海の生き物が観察できる。,幕末に建てられた国の指定史跡「西宮砲台」が浜辺のすぐ近くに佇んでいる。,ウインドサーフィンやパドルボードなどのマリンスポーツを楽しむ人々で年中賑わう。,,,,
2_夏,F5,96,神呪寺,寺神社,https://www.kabutoyama-kanneoji.or.jp/,甲山の中腹に位置し、「甲山大師」として親しまれる真言宗の古刹。空海が開創したと伝えられ、境内にある展望台からは西宮市内から大阪湾までを見渡すことができる絶景スポットです。,淳和天皇の妃・如意尼によって天長7（830）年に開かれたと伝わる大変歴史のある古刹。,本堂前の舞台（展望スペース）からは西宮市街や大阪平野・大阪湾が一望できる大パノラマ！,本尊の「如意輪観世音菩薩半跏像」は日本三如意輪の一つに数えられる国指定の重要文化財。,,,,
2_夏,F6,78,阪神甲子園球場(全国高等学校野球選手権大会),施設,https://www.hanshin.co.jp/koshien/,阪神タイガースの本拠地であり、全国の高校球児たちが熱戦を繰り広げる「高校野球の聖地」。ツタに覆われた歴史ある外観と大観衆の熱気に包まれる、日本の野球文化の象徴的な施設です。,夏の甲子園（全国高校野球選手権大会）では全国から勝ち抜いた高校が熱戦を繰り広げる。,敗れた高校球児が持ち帰る「甲子園の土」は春夏の大会ごとにグラウンドキーパーが手入れしている。,外壁を覆うツタは球場開設100周年事業（リニューアル）を経て大切に育て直されている。,,,,
2_夏,F7,183,有馬川緑道,自然,https://www.nishi.or.jp/,山口町エリアを流れる有馬川の河川敷に沿って整備された、緑と水辺の潤いを感じられる散策路。春の桜や初夏のホタルなど四季の自然が美しく、地域の人々の健康づくりや憩いの場です。,西宮市北部の山口地区を流れる清流・有馬川に沿って整備された緑豊かな散策路。,初夏（5月下旬～6月上旬）には川沿いにホタル（ゲンジボタル）が舞う幻想的な風景が見られる！,春の桜や秋の紅葉など北摂の自然の豊かさを存分に感じながらウォーキングができる。,,,,
2_夏,G1,85,住吉神社,寺神社,https://www.nishi.or.jp/,西宮市内に複数ある住吉神社の中でも、地域の鎮守として古くから信仰を集める神社。静かで厳かな境内には立派な木々が茂り、お祭りや初詣など季節の行事では地元の人々で賑わいます。,航海安全・海上安全の神様「住吉三神」を祀り西宮港の船乗りや酒造業者から深く信仰された。,境内には航海の安全を祈願して寄進された古い石灯籠や手水鉢などが残っている。,今津や西宮浜に近くかつて西宮が江戸への酒輸出品の出荷港として賑わった歴史を伝える。,,,,
2_夏,G2,34,海釣り広場,施設,https://www.naruohama-park.jp/,鳴尾浜公園内に併設された、安全柵や水道設備が整った有料の海釣り施設。初心者や子供連れでも安心して釣りを楽しむことができ、季節に応じた多様な魚が釣れる人気のスポットです。,安全柵や売店・トイレ・レンタル竿が完備されており手ぶらで行っても釣りが楽しめる。,サビキ釣りでアジやイワシがよく釣れるため子どもたちの釣りデビューに最適な大人気スポット。,チヌ（クロダイ）やスズキなどの大型魚も狙えるため地元のベテラン釣り師も多く通う。,,,,
2_夏,G3,176,鳴尾浜ベイエリア,自然,https://nishinomiya-kanko.jp/,鳴尾浜臨海公園や温浴施設、スポーツ施設が集まる、海に面した開放的なエリア。潮風を感じながら海辺を散策したり芝生広場で過ごしたりと、都市部から離れてリフレッシュできる空間です。,海に面した開放的なエリアで芝生広場や海釣り・温泉施設などが集まるレジャースポット。,大阪湾を一望できるプロムナードがあり心地よい潮風を感じながら散策ができる。,かつて阪神タイガースの二軍本拠地（鳴尾浜球場）があり若手選手の育成の街としても親しまれた。,,,,
2_夏,G4,64,甲子園浜,自然,https://nishinomiya-kanko.jp/,阪神間で唯一、自然の砂浜と干潟が残る貴重な海浜エリアで、国指定の鳥獣保護区。渡り鳥が飛来し、ウィンドサーフィンなどのメッカとしても知られる自然とアクティビティが共存するスポットです。,渡り鳥の中継地として大変重要で国指定の鳥獣保護区・干潟として大切に保全されている。,ウインドサーフィンの聖地として全国的に有名で年中カラフルなセイルが海に浮かぶ。,ライオン像は、潮が引いたときだけ現れる“甲子園浜の海の遺跡”です。戦前の遊園地『浜甲子園阪神パーク』の名残で、浴場の湯口の装飾だったといわれています。,,,,
2_夏,G5,115,西宮神社沖恵美酒神社,寺神社,https://nishinomiya-ebisu.jp/,えびす神社の総本社・西宮神社の境内に鎮座する末社で、別名「あらえびす」と呼ばれる神社。勝負事や商売繁盛に強いご利益があるとされ、本殿とともに多くの参拝者が訪れるパワースポットです。,西宮神社境内の南門近くに鎮座し地元では「荒えびす（あらえびす）さん」と親しまれている。,荒御魂（あらみたま）を祀ることから特に勝負運やスポーツの必勝祈願にご利益があるとされる。,西宮神社参拝の際には本殿と合わせて必ずお参りするファンや市民が多い隠れたパワースポット。,,,,
2_夏,G6,153 ,武庫川女子大学キャンパス,施設,https://www.mukogawa-u.ac.jp/,鳴尾エリアに位置する、煉瓦造りの美しい学舎が立ち並ぶ広大なキャンパス。旧甲子園ホテルを活用した「甲子園会館」は、フランク・ロイド・ライトの愛弟子が設計した近代建築の傑作です。,上甲子園キャンパスにある「甲子園会館」は昭和初期の旧甲子園ホテルで東の帝国ホテルと並ぶ名建築！,建築家ライトの影響を受けたフランク・ロイド・ライト様式の美意識が宿る国の登録有形文化財。,鳴尾・甲子園エリアを中心に複数のキャンパスを展開し西宮の文教・学びの街を象徴する。,,,,
3_秋,A2,128 ,大関関寿庵,商業施設,https://www.ozeki.co.jp/,日本酒「大関」のアンテナショップ。しぼりたての生原酒の量り売りや、日本酒を使ったオリジナルスイーツが味わえる、お酒好きにはたまらない観光スポットです。,蔵元「大関」の直営店でここでしか味わえない「蔵出し生原酒」の量り売りがある！,吟醸酒を使った「酒饅頭」や「酒粕ソフトクリーム」などオリジナルスイーツが大人気。,魁蔵は大関が65年ぶりに新設したマイクロ酒蔵。伝統の丹波杜氏の技と若手の発想を融合させた挑戦の蔵。2026年から魁蔵の日本酒を販売。,,,,

3_秋,B1,46 ,具足塚古墳,史跡,https://www.nishi.or.jp/,西宮市内の住宅街にひっそりと残る、6世紀後半に作られたとされる円墳。出土品から武具が発見されたことが名前の由来で、古代の西宮の歴史を今に伝える貴重な遺跡です。,武具（具足）を埋めたという伝承から「具足塚（ぐそくづか）」の名がついたとされる。,古墳時代後期（6世紀）の円墳で横穴式石室の石材が一部露出している。,住宅街の中にぽっかりと浮かぶ緑の小丘として地域の歴史を今に伝える。,,,,

3_秋,B7,24 ,越水城址,史跡,https://www.nishi.or.jp/,戦国時代に細川氏によって築かれた越水城の跡地。現在は住宅街や学校となっており遺構はほとんど残っていませんが、城跡を示す石碑が立ち、地域の歴史ロマンを感じさせます。,戦国時代に三好長慶が城主となり摂津国支配の拠点（三好氏の主城）とした重要なお城。,現在は住宅街の中に「越水城跡」の石碑が佇みかつての平山城の面影を伝えている。,西宮の歴史を語る上で欠かせない戦国時代の合戦や政治の舞台となった場所。,,,,

3_秋,C2,140 ,灘五郷文化圏,施設,https://nadagogo.ne.jp/,日本一の酒どころとして知られる「灘五郷」（西宮、今津などを含む5つの郷）が織りなす歴史・文化エリア。良質な「宮水」と酒米が生み出す伝統的な酒造りの文化が息づいています。,西宮郷・今津郷・魚崎郷・御影郷・西郷の5つの酒造地帯からなる日本一の酒どころ！,酒造りに最適な「宮水」と酒米の王者「山田錦」・六甲おろしが揃う奇跡の地域。,日本酒だけでなく酒粕を使ったグルメや樽知恵・職人技などの伝統文化が集積する。,,,,

3_秋,D4,184 ,老松古墳,史跡,https://www.nishi.or.jp/,住宅街の公園内に保存されている、6世紀後半に作られたとされる横穴式石室を持つ古墳。フェンス越しに内部の様子をうかがうことができ、古代の西宮の姿を今に伝える貴重な史跡です。,西宮市老松町の住宅街の中に保存されている古墳時代後期（6世紀）の円墳。,阪神・淡路大震災で石室の天井石がずり落ちた。また、2012年には史跡整備が完了している。,横穴式石室の痕跡が残り甲山南麓に広がる古代豪族の生活圏を今に伝える。,,,,
3_秋,D5,2 ,JR甲子園口ほんわか商店街,商業施設,https://nishinomiya-kanko.jp/,JR甲子園口駅から南へ真っ直ぐ伸びる、活気あふれる地元密着型の商店街。飲食店や総菜屋など200店舗以上が軒を連ね、食べ歩きやローカルな買い物を楽しめる温かい雰囲気が魅力です。,かつては「甲子園口商店街」だったが公募により親しみやすい「ほんわか商店街」に改称された。,商店街の公式キャラクターは、お稲荷さんをモチーフにした狐のキャラクター「コウちゃん」,飲食店や老舗の専門店が立ち並び歩行者天国イベントなども開催される地元密着スポット。,,,,
3_秋,D6,138 ,湯山街道,史跡,https://www.nishi.or.jp/,かつて西宮から有馬温泉へと向かう湯治客や物資を運ぶ人々が行き交った歴史ある街道。名塩や山口町などに当時の宿場町や道標の面影が残り、古き良き時代を感じながら歴史散策を楽しめます。,かつて江戸時代に西宮港から有馬温泉（湯山）へと湯治客や物資を運んだ重要な街道。,沿道には道標や昔ながらの街並み・古い地名が残り歴史散策コースとして人気。,豊臣秀吉や多くの文人墨客もこのルートを通って有馬を目指したとされるロマン溢れる道。,,,,
3_秋,D7,137 ,東六甲展望台,施設,https://www.royu.co.jp/,芦有ドライブウェイの途中にある、標高645mの展望台。眼下に西宮や大阪平野、大阪湾の大パノラマが広がり、秋の澄んだ空気の中では特に美しい夜景が楽しめる関西屈指のビュースポットです。,標高645mからの大パノラマは「日本夜景遺産」にも選定されている関西屈指の夜景スポット！,テレビドラマ『半沢直樹』などのロケ地としても使用され一躍有名になった。,天気が良ければ大阪湾一帯から関西国際空港・生駒山系まで見渡せるダイナミックな景観。,,,,
3_秋,E1,20 ,メタセコイアの並木(枝川町),自然,https://nishinomiya-kanko.jp/,枝川町周辺の道路沿いに約400mにわたって続くメタセコイアの並木道。秋には木々がレンガ色に美しく紅葉し、まるで絵画のようなノスタルジックな風景の中をドライブや散策できます。,「生きている化石」と呼ばれるメタセコイアが整然と立ち並ぶ美しいストリート。,春の新緑の鮮やかなグリーンと秋から冬にかけての黄金色・レンガ色の紅葉が絶景！,住宅街の中にあり静かな散歩や写真撮影を楽しむ市民の隠れた癒やしスポット。,,,,
3_秋,E2,39 ,丸山城跡,史跡,https://www.nishi.or.jp/,西宮市北部の山口町にある、中世に築かれた山城の跡。標高約378mの丸山山頂に位置し、登山道を登ると土塁や堀切などの遺構が確認でき、戦国時代の面影と豊かな自然を同時に楽しめます。,標高378mの丸山山頂に位置し西宮から丹波方面への交通の要衝を監視していた山城。,戦国時代に有馬氏や別所氏などの武将が関わったとされる城砦の遺構。,"丸山城跡がある丸山は、山容が美しいことから「山口富士」とも呼ばれています。標高は378mで、富士山の町道10分の1になります。(富士山は、3,776 m)",,,,
3_秋,E3,141 ,日本盛酒蔵通り煉瓦館,施設,https://www.nihonsakari.co.jp/rengakan/,日本酒「日本盛」が運営する、ガラス工房やレストランを併設した観光施設。しぼりたて生原酒の試飲販売のほか、美味しい和食や日本酒コスメの購入もでき、日本酒の魅力を満喫できます。,赤煉瓦のレトロでおしゃれな建物で日本盛の出来立て生原酒や限定酒が試飲できる！,敷地内には日本料理店「花さかり」やガラス工芸工房があり体験教室も開催。,醸造元ならではの化粧品（米ぬか美人に代表される日本酒コスメ）も充実。,,,,
3_秋,E4,4 ,アガペ大鶴美術館,美術館,https://nishinomiya-kanko.jp/,医療法人が運営する、ヨーロッパの宮殿のような白亜の美しい外観が特徴の美術館。絵画や彫刻など多彩な芸術作品が展示されており、優雅な空間でゆったりとアート鑑賞を楽しめる穴場スポットです。,医療法人社団アガペ会によって設立された美術館で緑豊かな甲山麓に位置する。,西洋彫刻や象牙彫刻・絵画など多岐にわたるコレクションが静かな空間で鑑賞できる。,敷地内には四季折々の花が咲きゆったりとした時間を過ごせる隠れたアートスポット。,,,,
3_秋,E5,163 ,万代大澤醸造(徳若),施設,https://tokuwaka.com/,西宮の伝統的な酒造りの技を受け継ぐ、手造りにこだわる小さな蔵元。蔵元直売所でしか買えない限定酒「徳若」の原酒などを試飲・購入でき、日本酒通にはたまらない隠れた名店です。,西宮で最も規模が小さいながら全量をしぼりたて生原酒メインで手造りするこだわりの蔵元！,2005年に会社分割により大澤本家酒造と万代大澤醸造に分かれる。銘柄「寳娘」は大澤本家酒造、「徳若」は万代大澤醸造が継承。,直売所では蔵元でしか手に入らないプレミアムな生原酒を試飲・直売しており日本酒ファンに大人気。,,,,
3_秋,E6,73 ,今津六角堂,史跡,https://www.nishi.or.jp/,明治時代に建てられた、六角形の洋風建築が目を引くレトロな歴史的建造物。元々は小学校の校舎の一部として使われていたもので、現在は地域のシンボルとして大切に保存・公開されています。,明治6（1873）年に建てられた小学校校舎（旧今津小学校）で兵庫県内最古の擬洋風学校建築！,屋根の上に六角形の太鼓楼が乗っていることから「六角堂」の愛称で親しまれている。,昭和初期に解体の危機があったが市民の保存運動によって移築・保存された感動の歴史がある。,,,,
3_秋,E7,8 ,ガベノ城,史跡,https://yamaaruki17.sakura.ne.jp/peak/peakgabe.html,西宮市の高級住宅街・剣谷町の裏山からアプローチする、標高483mの山のピーク。城跡という確かな文献はないが、見晴らしの良いハイキングコースとして親しまれており、大阪湾までを一望できる。,市作成の地図に、この場所の名前が初めて記されたのは１９７９年で、その時は「ガクノ城」でした。８５年から「カベノ城」に変わっています,標高約483mの山頂からは西宮市街や大阪湾までを一望できる隠れた絶景ポイント！,ガベノ城は「城ではないかもしれないのに“城”と呼ばれ続けている謎スポット」,,,,
3_秋,F1,144 ,白鹿クラシックス,施設,https://classics.hakushika.co.jp/,辰馬本家酒造が手掛ける、レストランとショップが融合した和モダンな施設。蔵元ならではの美味しいお酒とともに、四季折々の食材を使った本格的な日本料理を贅沢な空間で味わえます。,「白鹿」の辰馬本家酒造直営でおしゃれな空間で日本酒と和食のペアリングを楽しめる。,レストランでは蔵元ならではの「絞りたて生酒」や酒粕を使った特製鍋・御膳が味わえる。,併設のショップでは季節限定の日本酒や酒蔵スイーツ・おつまみが勢揃い！,,,,
3_秋,F2,83 ,酒ミュージアム,博物館,https://www.hakushika.co.jp/museum/,日本酒「白鹿」の歴史と文化を学べる体験型ミュージアム。酒造りの道具展示のほか、季節ごとの特別展も開催され、西宮の酒造りの伝統と職人の技に深く触れることができます。,日本で唯一の「酒」を専門テーマにした博物館で「酒蔵館」と「記念館」からなる。,昔ながらの木製酒造道具（市指定有形民俗文化財）や酒造り唄などをリアルに学べる！,敷地内には笹部新太郎氏ゆかりの桜「笹部桜」をはじめとする珍しい桜も植えられている。,,,,
3_秋,F3,146 ,白鷹禄水苑,施設,https://hakutaka.jp/rokusuiens.html,伊勢神宮の御料酒にも選ばれる名酒「白鷹」の蔵元が運営する文化施設。伝統的な酒蔵の建物を再現しており、館内では日本酒の試飲販売や、蔵元の暮らしを伝える展示、和食レストランを楽しめます。,伊勢神宮の御料酒（神様にお供えするお酒）に唯一選ばれている「白鷹」の直営施設！,「蔵生酒BAR」では他では味わえない絞りたての生原酒をその場で堪能できる。,江戸時代の酒造家の暮らしを再現した展示室や落ち着いた日本庭園が美しい。,,,,
3_秋,F4,37 ,関西学院大学構内古墳,史跡,https://www.kwansei.ac.jp/,美しいキャンパスで知られる関西学院大学の敷地内に静かに残る古墳。教育施設の中に古代の遺跡が保存されているという珍しいスポットで、大学の近代的な建物と古代史が交差する不思議な空間です。,大学のキャンパス内に本物の古代古墳がそのまま保存されている珍しいスポット！間学生にもあまり知られていない。,6世紀後半（古墳時代後期）に造られた円墳で横穴式石室が確認されている。,大学建設時の発掘調査で須恵器や土器などの貴重な遺物が出土した。,,,,
3_秋,F5,75 ,阪急西宮車庫,施設,https://www.hankyu.co.jp/,阪急西宮北口駅の近くにある、阪急電車の広大な車両基地。マルーンカラーの美しい車両がズラリと並ぶ様子は圧巻で、鉄道ファンや電車好きの子供たちにとってはフェンス越しに見学するのが楽しいスポットです。,阪急神戸線・今津線の車両がずらりと並ぶ広大な車両基地で鉄道ファンや子供に大人気！,かつて西宮北口駅にあった有名な「ダイヤモンドクロス（線路の平面交差）」の近くに位置する。,マルーン色の美しい阪急電車が洗車される様子や点検風景を敷地外から眺められる。,,,,
3_秋,F6,68 ,黒川古文化研究所,美術館,https://kurokawa-kobunka.or.jp/,苦楽園の静かな住宅街にある、東洋の古美術品などを研究・展示する施設。刀剣や書画、青銅器など質の高いコレクションを所蔵し、春と秋の特別展でのみ一般公開される知る人ぞ知る美術館です。,実業家・黒川家が収集した刀剣や古鏡・中国書画など国宝や重要文化財を含む貴重なコレクション！,特に「伏見天皇宸翰宝珠形短冊」や名刀などの刀剣コレクションは全国のファンを魅了する。,苦楽園の高台に位置し春と秋の特別展の時期にのみ開館するプレミアムな美術館。,,,,
3_秋,F7,185 ,鷲林寺,寺神社,https://jurinji.com/,六甲山系の麓に位置する、空海が開いたと伝えられる真言宗の古刹。秋には境内の木々が鮮やかに紅葉し、静寂に包まれた山寺の趣と美しい自然が調和した、心洗われる紅葉の名所です。,天長8（831）年に弘法大師空海が開創したとされる六甲山麓の歴史ある古刹。,弘法大師（空海）が入山した際、大鷲（ソランジン）が現れて火炎を吹いて行く手を阻んだ,秋には境内一面が鮮やかな赤や黄色に染まり西宮市内でも指折りの紅葉の名所として賑わう。,,,,
3_秋,G1,70 ,今津港史跡群,史跡,https://www.nishi.or.jp/,江戸時代に樽廻船の拠点として栄え、江戸へお酒を運んだ今津港の周辺に残る史跡群。現役の航路標識としては日本最古の「今津灯台」などがあり、かつての港町の繁栄と歴史を静かに伝えています。,江戸時代に今津郷から江戸へ大量の日本酒を素早く運ぶ「樽廻船（たるかいせん）」の重要拠点！,現存する日本最古級の木造灯台「今津灯台」など港町の歴史を物語る遺構が残る。,酒造業と海上交通が結びついて発展した西宮の豊かな歴史を感じられるスポット。,,,,
3_秋,G2,26 ,越木岩神社,寺神社,https://www.koshikiiwa-jinja.jp/,境内にある周囲約40mの巨石「甑岩（こしきいわ）」を御神体として祀る神社。子授けや安産の神様として信仰を集め、豊かな緑と巨石が織りなす神秘的な雰囲気はパワースポットとして人気です。,周囲約40m・高さ約10mの巨大な天然の巨石「甑岩（こしきいわ）」が御神体！,豊臣秀吉が大坂城築城の際に石垣として切り出そうとしたが祟りで断念したという伝説がある。,子孫繁栄や安産・女性の守護神として全国から多くの参拝者が訪れるパワースポット。,,,,
3_秋,G3,166 ,武庫川線,交通,https://www.hanshin.co.jp/,阪神電鉄の武庫川駅から武庫川団地前駅までを結ぶわずか1.7kmの短いローカル路線。元々は軍需工場への輸送用に作られ、現在はタイガースカラーの鮮やかなラッピング車両が走る地域密着の路線です。,本線から分岐して武庫川の土手沿いを走る、全4駅・乗車時間約5分の短いミニ路線。,走っている車両すべてが阪神タイガースの特別塗装（トラッキー柄など）になっており、ファンにはたまらない！,第二次世界大戦中に川西航空機（現・新明和工業）の工場へ従業員を運ぶために急遽建設された歴史を持つ。,,,,
3_秋,G4,52 ,公智神社,寺神社,https://kouchi-jinja.or.jp/,山口町に鎮座し、木の神様を祀る古社。秋に行われる例祭では、だんじりが宮入りする勇壮な秋祭りが有名で、豊かな鎮守の森に囲まれた境内は地域の人々の信仰と憩いの場となっています。,延喜式神名帳にも記載されている平安時代以前からの歴史を持つ由緒ある式内社。,毎年10月の秋季例大祭では豪華な「だんじり（地車）」が境内に参入し大迫力！,承徳元年（1097年）の大洪水により旧社地から現在地へ遷座したとされています。,,,,
3_秋,G5,129 ,大澤本家酒造(寳娘),施設,https://takaramusume.co.jp/,今津郷にある、「寳娘（たからむすめ）」の銘柄で知られる手造りの木造蔵。昔ながらの製法を守り続ける温かみのある酒蔵で、しぼりたての生原酒の量り売りなど直売ならではの買い物が楽しめます。,安政元（1854）年創業の伝統ある酒蔵で銘柄「寳娘（たからむすめ）」で知られる。,昔ながらの木製道具や手造りにこだわりじっくりと丹精込めた酒造りを続けている。,直売所では出来立ての生原酒の試飲や蔵元ならではの珍しいお酒を購入できる。,,,,
3_秋,G6,147 ,八十塚古墳群,史跡,https://www.nishi.or.jp/,西宮市北部の山口町エリアに点在する、古墳時代後期に作られた多数の古墳の総称。地域の開発の中で保存された一部の古墳を見学でき、古代の豪族たちの息遣いを感じられる歴史遺産です。,かつて80基以上の古墳（横穴式石室）が密集していたことから「八十塚（やそづか）」の名がついた！,古墳時代後期（6世紀後半～7世紀）に渡来系技術を持つ集団や地元豪族によって作られたとされる。,発掘調査では馬具や装身具・渡来系土器が多数出土し古代西宮の活発な文化交流を物語る。,,,,

    function parseCSV(text) {
        let p = '', row = [''], ret = [row], i = 0, r = 0, s = !0, l;
        for (l of text) {
            if ('"' === l) {
                if (s && l === p) row[i] += l;
                s = !s;
            } else if (',' === l && s) l = row[++i] = '';
            else if ('\n' === l && s) {
                if ('\r' === p) row[i] = row[i].slice(0, -1);
                row = ret[++r] = [l = '']; i = 0;
            } else row[i] += l;
            p = l;
        }
        return ret.filter(r => r.length > 1 || r[0] !== "");
    }

    // 自動初期化（CSV読み込みを内蔵）
    function initData() {
        const csvArray = parseCSV(embeddedCSV);
        const headers = csvArray[0].map(h => h.trim());
        placeData = [];
        for (let i = 1; i < csvArray.length; i++) {
            let obj = {};
            for (let j = 0; j < headers.length; j++) {
                obj[headers[j]] = csvArray[i][j] ? csvArray[i][j].trim() : "";
            }
            placeData.push(obj);
        }
    }

    initData();

    // ゲームメイン処理
    function executeMain() {
        const selectedSeason = document.querySelector('input[name="season"]:checked');
        if (!selectedSeason) return;

        let cellValue = document.getElementById('cellInput').value.toLowerCase().trim();

        const cellRegex = /^[a-g][1-7]$/;
        if (!cellRegex.test(cellValue) || cellValue === 'a1' || cellValue === 'g7') {
            alert("正しく入力してください\nNG文字列: " + document.getElementById('cellInput').value);
            document.getElementById('cellInput').value = '';
            document.getElementById('cellInput').focus();
            return;
        }

        const upperCell = cellValue.toUpperCase();
        const seasonStr = selectedSeason.value;

        const targetData = placeData.find(d => 
            d['セル位置'] === upperCell && d['季節'].includes(seasonStr)
        );

        let dispName = "データなし";
        let dispDesc = "該当するデータが見つかりませんでした。";
        let dispUnchiku = "";

        if (targetData) {
            dispName = targetData['名称'];
            dispDesc = targetData['説明文'];
            const unchikuNum = Math.floor(Math.random() * 3) + 1;
            dispUnchiku = targetData[`うんちく${unchikuNum}`];
        }

        const mpRand = Math.floor(Math.random() * 100) + 1;
        let mpResult = "";
        
        if (mpRand === 100) {
            mpResult = "もっているMPを全部 他の人に分配し、端数没収";
        } else if (mpRand >= 95 && mpRand <= 99) {
            mpResult = "もっているMPをすべて没収";
        } else if (mpRand >= 1 && mpRand <= 10) {
            mpResult = `MPを -${mpRand} ポイント取得（${mpRand}ポイント没収）`;
        } else {
            const getPoints = Math.floor(mpRand / 10) - 1;
            mpResult = `MPを ${getPoints} ポイント取得`;
        }

        document.getElementById('dlgSeasonCell').textContent = `${seasonStr} / ${upperCell}`;
        document.getElementById('dlgName').textContent = dispName;
        document.getElementById('dlgDesc').textContent = dispDesc;
        document.getElementById('dlgUnchiku').textContent = dispUnchiku;
        document.getElementById('dlgMp').textContent = mpResult;
        
        const infoDialog = document.getElementById('infoDialog');
        infoDialog.showModal();
        infoDialog.scrollTop = 0;
    }

    document.getElementById('okBtn').addEventListener('click', executeMain);
    document.getElementById('cellInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            executeMain();
        }
    });

    document.getElementById('dialogOkBtn').addEventListener('click', function() {
        document.getElementById('infoDialog').close();
        const cellInput = document.getElementById('cellInput');
        cellInput.value = '';
        cellInput.focus();
    });
</script>
